</head>

    <button class="menu-btn md:hidden p-2 rounded-xl" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

    <li><a href="index.html"     class="nav-link">App Link</a></li>
    <li><a href="waitlist.html"  class="nav-link" aria-current="page">Waitlist</a></li>
    <li><a href="help.html"      class="nav-link">Help</a></li>

  </ul>

<main>
<!-- ═══════════════════ HERO: WAITLIST ═══════════════════ -->
<section style="
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  padding-top:66px;
  overflow:hidden;
  background:
    radial-gradient(ellipse 85% 65% at 78% 18%, rgba(168,230,207,0.52) 0%, transparent 65%),
    radial-gradient(ellipse 55% 45% at 15% 88%, rgba(32,200,151,0.14) 0%, transparent 60%),
    #E7F7F4;
">
  <!-- Decorative blobs -->
  <div aria-hidden="true" style="position:absolute;top:-120px;right:-80px;width:560px;height:560px;border-radius:50%;background:rgba(168,230,207,0.28);filter:blur(72px);pointer-events:none;"></div>
  <div aria-hidden="true" style="position:absolute;bottom:-100px;left:-80px;width:340px;height:340px;border-radius:50%;background:rgba(32,200,151,0.11);filter:blur(60px);pointer-events:none;"></div>

  <div class="max-w-6xl mx-auto px-6 w-full grid md:grid-cols-2 items-center" style="gap:56px;padding-top:56px;padding-bottom:120px;">

    <!-- Copy + form -->
    <div class="reveal" style="max-width:520px;">
      <img src="assets/logo-trimmed.png" alt="" style="height:88px;width:auto;margin-bottom:24px;display:block;" />

      <h1 class="font-display" style="font-size:clamp(40px,4.6vw,60px);font-weight:900;line-height:1.04;letter-spacing:-0.03em;color:#000;margin-bottom:32px;">
        Join the waitlist to get notified for our
        <span style="color:#20C897;">full launch!</span>
      </h1>

      <form class="form-card" data-sheet-endpoint="https://script.google.com/macros/s/AKfycbzJBHHh5Cw8lle4p_9RXoZTMMKHqdsywUkj-omVOFo0p-CVEqq_4hWC_NpXcwiBhNf1sQ/exec">
        <div class="field">
          <label class="field-label" for="wl-name">Name</label>
          <input class="input" id="wl-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label class="field-label" for="wl-email">Email</label>
          <input class="input" id="wl-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label class="field-label" for="wl-city">City</label>
          <input class="input" id="wl-city" name="city" type="text" autocomplete="address-level2" required />
        </div>
        <div class="field">
          <label class="field-label" for="wl-early">Do you want early access?</label>
          <select class="input" id="wl-early" name="early_access" required>
            <option value="" disabled selected>Select…</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <button type="submit" class="btn-green btn-block" style="margin-top:28px;padding:14px 28px;font-size:16px;">Submit</button>
        <p class="form-status" role="status"></p>
      </form>
    </div>

    <!-- Phone mockup -->
    <div class="reveal d1 flex justify-center md:justify-end">
      <div class="phone-float mockup">
        <img src="assets/old-site/phone-blueberries.png" alt="Nrhoot app showing a Blueberries listing: $5 box, under 0.5 miles away, with Message and Make Offer buttons" class="mockup-img" style="width:min(300px,78vw);" />
      </div>
    </div>
  </div>

  <!-- Wave transition -->
  <div aria-hidden="true" style="position:absolute;bottom:0;left:0;right:0;line-height:0;">
    <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" height="70">
      <path d="M0,40 C280,70 480,10 720,40 C960,70 1160,10 1440,40 L1440,70 L0,70Z" fill="#ffffff"/>
    </svg>
  </div>
</section>
</main>


<!-- ═══════════════════ FOOTER ═══════════════════ -->

  <div class="max-w-6xl mx-auto px-6">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:32px;margin-bottom:40px;">

      <div>
        <img src="assets/logo-trimmed.png" alt="Nrhoot" style="height:44px;width:auto;margin-bottom:12px;" />
        <p style="font-size:13px;color:#8E8E93;line-height:1.65;max-width:220px;">
          Fresh produce. Real neighbors.<br/>True community.
        </p>
      </div>

      <nav aria-label="Footer">
        <ul style="display:flex;flex-wrap:wrap;gap:10px 32px;list-style:none;">
          <li><a href="index.html"     class="foot-link">App Link</a></li>
          <li><a href="waitlist.html"  class="foot-link">Waitlist</a></li>
          <li><a href="help.html"      class="foot-link">Help</a></li>
          <li><a href="follow-us.html" class="foot-link">Follow Us</a></li>
          <li><a href="mailto:tnrhoot@gmail.com" class="foot-link">Contact</a></li>
        </ul>
      </nav>
    </div>

    <div style="border-top:1px solid #E5E5EA;padding-top:22px;text-align:center;">
      <p style="font-size:12px;color:#8E8E93;">© 2026 Nrhoot. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="site.js"></script>
</body>
</html>
